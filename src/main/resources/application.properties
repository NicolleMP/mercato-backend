spring.application.name=mercato

spring.datasource.url=jdbc:mysql://localhost:3306/mercato_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=JWT_SECRET_KEY
jwt.access-expiration-ms=900000   # 15 minutos
jwt.refresh-expiration-ms=604800000  # 7 dias

